  # 数据库服务
  db:
    image: postgres:16-alpine
    container_name: flahcicle_db
    environment:
      - POSTGRES_DB=flashc
      - POSTGRES_USER=flashc
      - POSTGRES_PASSWORD=flashc
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - flashc_net

volumes:
  pgdata:


networks:
  flashc_net:
    name: flashc_net

