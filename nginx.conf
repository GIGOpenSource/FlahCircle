user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 100m;

    log_format main '$remote_addr_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name liangstart.online www.liangstart.online;

        location / {
            # 将请求转发到 8080 端口的服务
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        access_log /var/log/nginx/liangstart-access.log;
        error_log /var/log/nginx/liangstart-error.log;
    }
    # 前端配置 - GIG-X 8080端口
    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html/gig-x;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
            error_page 405 =200 $uri;
        }

        # API请求转发（修正路径拼接问题）
        location /api/ {
            # 关键：去掉proxy_pass末尾的/api/，仅保留主机和端口
            proxy_pass http://flashc_web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        access_log /var/log/nginx/gig-x-access.log;
        error_log /var/log/nginx/gig-x-error.log;
    }

    # 后端配置 - gig-admin 8081端口
    server {
        listen 8081;
        server_name localhost;
        root /usr/share/nginx/html/gig-admin;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
            error_page 405 =200 $uri;
        }

        # API请求转发（同样修正路径）
        location /api/ {
            proxy_pass http://flashc_web:8000;  # 去掉末尾的/api/
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        access_log /var/log/nginx/gig-admin-access.log;
        error_log /var/log/nginx/gig-admin-error.log;
    }

    include /etc/nginx/conf.d/*.conf;
}
